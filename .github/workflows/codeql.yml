name: CodeQL

on:
  workflow_dispatch: # run manually from Actions → CodeQL → Run workflow

jobs:
  analyze:
    name: Analyze Swift
    runs-on: xcode-27 # GitHub's macOS image with Xcode 27 (public preview), to match your local Xcode
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build SUMB
        working-directory: source
        run: |
          xcodebuild clean build \
            -scheme SUMB \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"